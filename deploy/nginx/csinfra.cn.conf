server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;

    server_name csinfra.cn www.csinfra.cn;

    root /srv/csinfra.cn/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/csinfra.cn.access.log;
    error_log /var/log/nginx/csinfra.cn.error.log;

    gzip_static on;
    gzip_vary on;
    etag on;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /rank/ {
        try_files /rank/index.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /rank/index.html {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /os/ {
        try_files /os/index.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /os/index.html {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location ^~ /api/scores/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location ^~ /api/classroom/v1/ {
        proxy_pass http://127.0.0.1:8081;
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /rank/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /os/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /studios/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /og.png {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    ssl_certificate /etc/letsencrypt/live/csinfra.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csinfra.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;

    server_name csinfra.cn www.csinfra.cn;
    server_tokens off;

    return 301 https://$host$request_uri;
}
