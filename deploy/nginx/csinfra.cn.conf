server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;

    server_name csinfra.cn www.csinfra.cn;

    root /srv/csinfra.cn/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/csinfra.cn.access.log;
    error_log /var/log/nginx/csinfra.cn.error.log;

    gzip_static on;
    gzip_vary on;
    etag on;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /studios/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /og.png {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    ssl_certificate /etc/letsencrypt/live/csinfra.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csinfra.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;

    server_name csinfra.cn www.csinfra.cn;
    server_tokens off;

    return 301 https://$host$request_uri;
}
